<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽翼</title>
    <style>
        @font-face {
    font-family: 'I.Ming';
    src: url('fonts/I.Ming-8.10.ttf') format('truetype');
    font-weight: 300 400;
    font-display: swap;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'I.Ming', 'Noto Serif SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
        }

        .main-screen {
            width: 100%;
            height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .bg-logo {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 210vw;
            height: 210vw;
            max-width: 1750px;
            max-height: 1750px;
            object-fit: contain;
            pointer-events: none;
            z-index: 0;
        }

        .institute-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.5s ease;
            text-decoration: none;
            color: #584267;
            position: relative;
            z-index: 1;
        }

        .institute-card.xinxuehui {
            background: rgba(88, 66, 103, 0.04);
            flex-direction: row;
        }
        .institute-card.xinxuehui:hover {
            background: rgba(88, 66, 103, 0.1);
        }

        .institute-card.minsheng {
            background: rgba(88, 66, 103, 0.02);
            flex-direction: row;
        }
        .institute-card.minsheng:hover {
            background: rgba(88, 66, 103, 0.08);
        }

        .institute-name-vertical {
            writing-mode: vertical-rl;
            font-size: 2rem;
            font-weight: 350;
            letter-spacing: 8px;
            color: #584267;
        }

        .institute-subtitle-vertical {
            writing-mode: vertical-rl;
            font-size: 0.95rem;
            letter-spacing: 6px;
            color: #7a6e8a;
            margin-left: 18px;
        }

        .institute-card.minsheng .institute-subtitle-vertical {
            margin-left: 0;
            margin-right: 18px;
        }

        .site-footer {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(to bottom, #665078 0%, #584267 60%, #4a3558 100%);
        }

        .copyright {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #c5bbd4;
            font-weight: 300;
            margin: 0;
        }

        @media (max-width: 768px) {
            .institute-name-vertical {
                font-size: 1.2rem;
                letter-spacing: 4px;
            }
            .institute-subtitle-vertical {
                font-size: 0.7rem;
                letter-spacing: 3px;
                margin-left: 12px;
            }
            .institute-card.minsheng .institute-subtitle-vertical {
                margin-left: 0;
                margin-right: 12px;
            }
            .bg-logo {
                width: 237vw;
                height: 237vw;
            }
        }
    </style>
</head>
<body>

    <div class="main-screen">
        <img class="bg-logo" src="羽頁.png" alt="Tusita">

        <a href="世界心學會.html" class="institute-card xinxuehui">
            <span class="institute-name-vertical">世界心學會</span>
            <span class="institute-subtitle-vertical">引護精神</span>
        </a>

        <a href="世界民生中心.html" class="institute-card minsheng">
            <span class="institute-subtitle-vertical">服務群生</span>
            <span class="institute-name-vertical">世界民生中心</span>
        </a>
    </div>

    <footer class="site-footer">
        <p class="copyright">© 2023-2026 白頭翁 · <a href="license.html" style="color: #c5bbd4; text-decoration: none;">授權條款</a></p>
    </footer>

</body>
</html>
