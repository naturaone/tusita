<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界心學會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Songti SC', 'Noto Serif SC', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
            position: relative;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px 12px;
            background: linear-gradient(
                to bottom,
                #4a3558 0%,
                #584267 60%,
                #665078 100%
            );
            flex-direction: column;
            position: relative;
        }

        .header-logo {
            width: 56px;
            height: 56px;
            filter: invert(1) brightness(2);
            object-fit: contain;
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
        }

        .back-link {
            position: absolute;
            left: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .home-link {
            position: absolute;
            right: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .home-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .menu-body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            height: calc(100vh - 90px);
        }

        .bg-logo {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110vmin;
            height: 110vmin;
            max-width: 1600px;
            max-height: 1600px;
            object-fit: contain;
            pointer-events: none;
            z-index: 0;
        }

        .menu-card {
            position: relative;
            z-index: 1;
            text-decoration: none;
            color: #584267;
            transition: opacity 0.5s ease;
        }

        .menu-card:hover {
            opacity: 0.7;
        }

        .menu-name-vertical {
            writing-mode: vertical-rl;
            font-size: 3rem;
            font-weight: 350;
            letter-spacing: 16px;
            color: #584267;
        }

        .site-footer {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(to bottom, #665078 0%, #584267 60%, #4a3558 100%);
        }

        .copyright {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #c5bbd4;
            font-weight: 300;
            margin: 0;
        }

        @media (max-width: 768px) {
            .menu-name-vertical {
                font-size: 2rem;
                letter-spacing: 10px;
            }
            .bg-logo {
                width: 100vmin;
                height: 100vmin;
            }
            .menu-body {
                height: calc(100vh - 80px);
            }
        }
    </style>
</head>
<body>

    <div class="site-header">
        <a href="羽翼.html" class="back-link">← 返回</a>
        <img class="header-logo" src="Tusita.png" alt="Tusita">
        <span class="header-title">世界心學會</span>
        <a href="知足天.html" class="home-link">首頁</a>
    </div>

    <div class="menu-body">

        <img class="bg-logo" src="知足天首頁.png" alt="Tusita">

        <a href="心學.html" class="menu-card">
            <span class="menu-name-vertical">心學</span>
        </a>

    </div>

    <footer class="site-footer">
        <p class="copyright">© 2023-2026 白頭翁 · <a href="license.html" style="color: #c5bbd4; text-decoration: none;">授權條款</a></p>
    </footer>

</body>
</html>
