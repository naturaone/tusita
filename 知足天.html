<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知足天</title>
    <style>
        @font-face {
            font-family: 'I.Ming';
            src: url('fonts/I.Ming-8.10.ttf') format('truetype');
            font-weight: 300 400;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'I.Ming', 'Noto Serif SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #f0ead8;
        }

        .main-screen {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .bg-logo {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 145vw;
            height: 145vw;
            max-width: 1260px;
            max-height: 1260px;
            object-fit: contain;
            pointer-events: none;
            z-index: 0;
        }

        .manifesto {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #584267;
            line-height: 2.4;
            padding: 20px 20px;
        }

        .site-footer {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(to bottom, #665078 0%, #584267 60%, #4a3558 100%);
        }

        .copyright {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #c5bbd4;
            font-weight: 300;
            margin: 0;
        }

        @media (max-width: 768px) {
            .manifesto {
                font-size: 1.3rem;
                line-height: 2.2;
                padding: 10px 20px;
            }
            .bg-logo {
                width: 175vw;
                height: 175vw;
            }
        }
    </style>
</head>
<body>

    <div class="main-screen" onclick="location.href='羽翼.html'">
        <img class="bg-logo" src="知足天首頁.png" alt="Tusita">
        <p class="manifesto">
            這是一個沒有國別的世界<br>
            不分種族、貴賤、高低、信仰、貧富、性別等一切殊相<br>
            人人自主，為本真而活
        </p>
    </div>

    <footer class="site-footer">
        <p class="copyright">© 2023-2026 白頭翁 · <a href="license.html" style="color: #c5bbd4; text-decoration: none;">授權條款</a></p>
    </footer>

</body>
</html>
